  <text x="24" y="156" class="sans" font-size="20" font-weight="700" fill="#ffffff">BMS Hardware Design</text>
  <text x="24" y="174" class="mono" font-size="11" fill="#00B4D8" letter-spacing="1">SCHEMATIC · PCB · MONITORING</text>
  <text x="24" y="198" class="sans" font-size="12.5" fill="#9aa9bd">Schematic and PCB design for the battery management</text>
