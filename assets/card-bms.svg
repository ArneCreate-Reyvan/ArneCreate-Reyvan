<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Project card: BMS hardware" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112a4a"/><stop offset="1" stop-color="#0b1220"/>
