  <g fill="none" stroke="#00B4D8" stroke-width="2">
    <path d="M205 55 H150 L130 75 H90"/><path d="M205 75 H170 L150 95 H90"/><path d="M205 95 H175 L160 105 H110"/>
    <path d="M275 55 H330 L350 75 H390"/><path d="M275 75 H310 L330 95 H390"/><path d="M275 95 H305 L320 105 H370"/>
