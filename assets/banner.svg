<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Profile banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="996" height="256" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: 'Segoe UI', Arial, sans-serif; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.4s ease-in-out 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  </style>

  <rect x="2" y="2" width="996" height="256" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#clip)" fill="none" stroke="#1d3b5f" stroke-width="2">
    <path d="M540 28 H690 L720 54 H1000"/>
    <path d="M580 236 H750 L775 210 H1000"/>
    <path d="M0 232 H170 L196 250 H330"/>
    <path d="M0 26 H60 L84 8 H240"/>
    <path d="M610 130 H700 L720 150 H760"/>
  </g>
  <g fill="#00E5FF">
    <circle class="pulse" cx="720" cy="54" r="4"/>
    <circle class="pulse2" cx="775" cy="210" r="4"/>
    <circle class="pulse" cx="760" cy="150" r="4"/>
    <circle class="pulse2" cx="240" cy="8" r="3"/>
  </g>

  <!-- battery -->
  <g transform="translate(775,80)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="#0d1b30" stroke="#00B4D8" stroke-width="3"/>
    <rect x="170" y="28" width="12" height="34" rx="3" fill="#00B4D8"/>
    <rect x="10" y="10" width="32" height="70" rx="5" fill="url(#cell)" opacity=".85"/>
    <rect x="50" y="10" width="32" height="70" rx="5" fill="url(#cell)" opacity=".85"/>
    <rect x="90" y="10" width="32" height="70" rx="5" fill="url(#cell)" opacity=".85"/>
    <rect x="130" y="10" width="32" height="70" rx="5" fill="url(#cell)" opacity=".85"/>
    <polygon points="100,-10 72,46 93,46 82,100 120,38 97,38" fill="#FFC933" filter="url(#glow)"/>
  </g>

  <text x="50" y="62" class="mono" font-size="14" fill="#6b84a3">&gt; hello_world();</text>
  <text x="50" y="118" class="sans" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="2">YOUR NAME</text>
  <text x="50" y="152" class="mono" font-size="15" fill="#00B4D8" letter-spacing="4">COMPUTER ENGINEERING @ ITS</text>

  <g class="mono" font-size="12" text-anchor="middle" fill="#cfe9f5">
    <rect x="50"  y="180" width="146" height="28" rx="14" fill="#0d1b30" stroke="#1f4e79"/><text x="123" y="198">HV Battery Design</text>
    <rect x="208" y="180" width="46"  height="28" rx="14" fill="#0d1b30" stroke="#1f4e79"/><text x="231" y="198">BMS</text>
    <rect x="266" y="180" width="82"  height="28" rx="14" fill="#0d1b30" stroke="#1f4e79"/><text x="307" y="198">Embedded</text>
    <rect x="360" y="180" width="46"  height="28" rx="14" fill="#0d1b30" stroke="#1f4e79"/><text x="383" y="198">ROS</text>
    <rect x="418" y="180" width="96"  height="28" rx="14" fill="#0d1b30" stroke="#1f4e79"/><text x="466" y="198">Full-stack</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
