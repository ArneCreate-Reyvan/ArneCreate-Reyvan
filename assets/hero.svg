<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="[Your Name], computer engineering student at ITS. Diagram of a 400V battery pack connected to an 80kW inverter and monitored by a BMS board." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D9D6CE"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F5F1" stop-opacity="1"/>
      <stop offset="1" stop-color="#F6F5F1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="999" height="399" rx="12"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="399" rx="12" fill="#F6F5F1" stroke="#E2E0D9"/>
  <g clip-path="url(#clip)">
    <rect x="520" y="1" width="479" height="398" fill="url(#dots)"/>
    <rect x="520" y="1" width="160" height="398" fill="url(#fade)"/>
  </g>

  <!-- text column -->
  <rect x="56" y="62" width="8" height="8" fill="#0A5CFF"/>
  <text x="76" y="70" class="mono" font-size="12" letter-spacing="2.4" fill="#0A5CFF">COMPUTER ENGINEERING · ITS</text>
  <text x="54" y="150" class="sans" font-size="56" font-weight="700" letter-spacing="-1" fill="#14171C">Your Name</text>
  <text x="56" y="196" class="sans" font-size="20" fill="#14171C">Vehicle electrification and embedded systems.</text>
  <text x="56" y="230" class="sans" font-size="15" fill="#6B7280">Designing high-voltage battery systems for competition vehicles.</text>
  <line x1="56" y1="296" x2="496" y2="296" stroke="#C9CED6"/>
  <text x="56" y="324" class="mono" font-size="11" letter-spacing="2" fill="#6B7280">CURRENTLY LOOKING FOR</text>
  <text x="56" y="348" class="sans" font-size="14" fill="#14171C">Electrical roles on engineering competition teams</text>

  <!-- figure: pack, inverter, BMS -->
  <g fill="none" stroke="#9AA3AF" stroke-width="1">
    <path d="M560 96 V84 H572"/><path d="M948 96 V84 H936"/>
    <path d="M560 372 V384 H572"/><path d="M948 372 V384 H936"/>
  </g>

  <!-- dimension line -->
  <g stroke="#14171C" stroke-width="1">
    <line x1="580" y1="112" x2="730" y2="112"/>
    <line x1="580" y1="107" x2="580" y2="117"/>
    <line x1="730" y1="107" x2="730" y2="117"/>
  </g>
  <text x="655" y="102" class="mono" font-size="11" letter-spacing="1" fill="#14171C" text-anchor="middle">PACK · 400V</text>

  <!-- pack -->
  <rect x="580" y="130" width="150" height="110" rx="6" fill="#ffffff" stroke="#14171C" stroke-width="1.5"/>
  <g fill="#DCE7FF" stroke="#0A5CFF" stroke-width="1">
    <circle cx="600" cy="152" r="9"/><circle cx="622" cy="152" r="9"/><circle cx="644" cy="152" r="9"/><circle cx="666" cy="152" r="9"/><circle cx="688" cy="152" r="9"/><circle cx="710" cy="152" r="9"/>
    <circle cx="600" cy="174" r="9"/><circle cx="622" cy="174" r="9"/><circle cx="644" cy="174" r="9"/><circle cx="666" cy="174" r="9"/><circle cx="688" cy="174" r="9"/><circle cx="710" cy="174" r="9"/>
    <circle cx="600" cy="196" r="9"/><circle cx="622" cy="196" r="9"/><circle cx="644" cy="196" r="9"/><circle cx="666" cy="196" r="9"/><circle cx="688" cy="196" r="9"/><circle cx="710" cy="196" r="9"/>
    <circle cx="600" cy="218" r="9"/><circle cx="622" cy="218" r="9"/><circle cx="644" cy="218" r="9"/><circle cx="666" cy="218" r="9"/><circle cx="688" cy="218" r="9"/><circle cx="710" cy="218" r="9"/>
  </g>

  <!-- power lines to inverter -->
  <line x1="730" y1="170" x2="800" y2="170" stroke="#0A5CFF" stroke-width="2"/>
  <line x1="730" y1="205" x2="800" y2="205" stroke="#14171C" stroke-width="2"/>
  <g fill="#ffffff" stroke="#14171C" stroke-width="1.5">
    <circle cx="730" cy="170" r="3.5"/><circle cx="730" cy="205" r="3.5"/>
    <circle cx="800" cy="170" r="3.5"/><circle cx="800" cy="205" r="3.5"/>
  </g>

  <!-- inverter -->
  <rect x="800" y="145" width="110" height="80" rx="6" fill="#ffffff" stroke="#14171C" stroke-width="1.5"/>
  <text x="855" y="173" class="mono" font-size="11" letter-spacing="1.5" fill="#6B7280" text-anchor="middle">INVERTER</text>
  <text x="855" y="205" class="sans" font-size="24" font-weight="700" fill="#14171C" text-anchor="middle">80kW</text>

  <!-- BMS board -->
  <g stroke="#0A5CFF" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="610" y1="296" x2="610" y2="240"/><line x1="655" y1="296" x2="655" y2="240"/><line x1="700" y1="296" x2="700" y2="240"/>
  </g>
  <g fill="#0A5CFF">
    <circle cx="610" cy="240" r="2.5"/><circle cx="655" cy="240" r="2.5"/><circle cx="700" cy="240" r="2.5"/>
  </g>
  <rect x="580" y="296" width="150" height="62" rx="6" fill="#EAF0FF" stroke="#0A5CFF" stroke-width="1.5"/>
  <rect x="620" y="309" width="40" height="36" fill="#ffffff" stroke="#14171C" stroke-width="1.2"/>
  <g stroke="#14171C" stroke-width="1.2">
    <line x1="612" y1="316" x2="620" y2="316"/><line x1="612" y1="327" x2="620" y2="327"/><line x1="612" y1="338" x2="620" y2="338"/>
    <line x1="660" y1="316" x2="668" y2="316"/><line x1="660" y1="327" x2="668" y2="327"/><line x1="660" y1="338" x2="668" y2="338"/>
  </g>
  <text x="680" y="332" class="mono" font-size="13" font-weight="700" fill="#0A5CFF">BMS</text>
  <text x="580" y="378" class="mono" font-size="10" letter-spacing="1" fill="#6B7280">BMS · SCHEMATIC + PCB</text>
  <text x="926" y="378" class="mono" font-size="10" letter-spacing="1" fill="#6B7280" text-anchor="end">FIG. 01</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
